<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Pavan — AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="55%" stop-color="#101822"/>
      <stop offset="100%" stop-color="#0D1520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A4C"/>
      <stop offset="100%" stop-color="#2E3A5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .fade-up   { opacity: 0; animation: fadeUp .9s ease-out forwards; }
    .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }

    .rule { stroke-dasharray: 210; stroke-dashoffset: 210; animation: draw 1.1s .7s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }

    .caret { animation: blink 1.15s steps(1) infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }

    .flow { stroke-dasharray: 5 9; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28 } }

    .node { animation: pulse 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .n1 { animation-delay: 0s } .n2 { animation-delay: .35s } .n3 { animation-delay: .7s }
    .n4 { animation-delay: 1.05s } .n5 { animation-delay: 1.4s } .n6 { animation-delay: 1.75s }
    .n7 { animation-delay: 2.1s }
    @keyframes pulse { 0%,100% { opacity:.35; transform: scale(1) } 50% { opacity:1; transform: scale(1.45) } }

    .core { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breathe { 0%,100% { opacity:.75 } 50% { opacity:1 } }

    .halo { animation: halo 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes halo { 0%,100% { opacity:.15; transform: scale(.85) } 50% { opacity:.5; transform: scale(1.15) } }

    .bar { transform-box: fill-box; transform-origin: left center; animation: grow 2.4s ease-in-out infinite; }
    .b1 { animation-delay: .1s } .b2 { animation-delay: .45s } .b3 { animation-delay: .8s }
    @keyframes grow { 0%,100% { transform: scaleX(.25); opacity:.35 } 45% { transform: scaleX(1); opacity:.95 } }

    @media (prefers-reduced-motion: reduce) {
      .fade-up,.rule,.caret,.flow,.node,.core,.halo,.bar { animation: none; opacity: 1; stroke-dashoffset: 0 }
    }
  </style>

  <rect width="1000" height="220" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="219" rx="15.5" fill="none" stroke="#1E2A38"/>
  <ellipse cx="820" cy="110" rx="190" ry="120" fill="url(#glow)" opacity="0.35"/>

  <!-- wordmark -->
  <g class="fade-up d1">
    <text x="52" y="92" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"
          font-size="54" font-weight="800" letter-spacing="6" fill="#F1F5F9">PAVAN</text>
  </g>

  <line class="rule" x1="54" y1="112" x2="264" y2="112" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <g class="fade-up d2">
    <text x="54" y="142" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="14" letter-spacing="5.5" fill="#38BDF8">AI ENGINEER</text>
  </g>

  <g class="fade-up d3">
    <text x="54" y="172" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
          font-size="13.5" fill="#7D8CA3">retrieval · agents · things that run in production</text>
    <rect class="caret" x="418" y="161" width="8" height="15" fill="#38BDF8"/>
  </g>

  <!-- pipeline: docs -> index -> model -> answer -->
  <g transform="translate(0,4)">
    <path d="M660 106 C 700 106, 700 106, 726 106" stroke="url(#wire)" stroke-width="1.6" fill="none"/>
    <path class="flow" d="M660 106 C 700 106, 700 106, 726 106" stroke="#38BDF8" stroke-width="1.6" fill="none" opacity="0.9"/>
    <path d="M790 106 C 812 106, 812 106, 838 106" stroke="url(#wire)" stroke-width="1.6" fill="none"/>
    <path class="flow" d="M790 106 C 812 106, 812 106, 838 106" stroke="#818CF8" stroke-width="1.6" fill="none" opacity="0.9"/>
    <path d="M898 106 C 916 106, 916 106, 930 106" stroke="url(#wire)" stroke-width="1.6" fill="none"/>
    <path class="flow" d="M898 106 C 916 106, 916 106, 930 106" stroke="#818CF8" stroke-width="1.6" fill="none" opacity="0.9"/>

    <!-- documents -->
    <g fill="none" stroke="#33465C" stroke-width="1.5">
      <rect x="614" y="70" width="30" height="24" rx="3"/>
      <rect x="614" y="94" width="30" height="24" rx="3"/>
      <rect x="614" y="118" width="30" height="24" rx="3"/>
    </g>
    <g stroke="#4B6178" stroke-width="1.4" stroke-linecap="round">
      <line x1="620" y1="79" x2="638" y2="79"/><line x1="620" y1="85" x2="632" y2="85"/>
      <line x1="620" y1="103" x2="638" y2="103"/><line x1="620" y1="109" x2="632" y2="109"/>
      <line x1="620" y1="127" x2="638" y2="127"/><line x1="620" y1="133" x2="632" y2="133"/>
    </g>

    <!-- vector index -->
    <g fill="#38BDF8">
      <circle class="node n1" cx="742" cy="76"  r="3.1"/>
      <circle class="node n2" cx="766" cy="90"  r="3.1"/>
      <circle class="node n3" cx="736" cy="104" r="3.1"/>
      <circle class="node n4" cx="762" cy="118" r="3.1"/>
      <circle class="node n5" cx="748" cy="132" r="3.1"/>
      <circle class="node n6" cx="774" cy="106" r="3.1"/>
      <circle class="node n7" cx="754" cy="60"  r="3.1"/>
    </g>

    <!-- model core -->
    <circle class="halo" cx="866" cy="106" r="30" fill="#818CF8"/>
    <path class="core" d="M866 80 L889 93 L889 119 L866 132 L843 119 L843 93 Z"
          fill="none" stroke="#A5B4FC" stroke-width="1.8"/>
    <circle class="core" cx="866" cy="106" r="6" fill="#A5B4FC"/>

    <!-- answer -->
    <g fill="#38BDF8">
      <rect class="bar b1" x="936" y="94"  width="34" height="4" rx="2"/>
      <rect class="bar b2" x="936" y="104" width="26" height="4" rx="2"/>
      <rect class="bar b3" x="936" y="114" width="30" height="4" rx="2"/>
    </g>

    <!-- travelling packet -->
    <circle r="3.6" fill="#E2E8F0">
      <animateMotion dur="3.4s" repeatCount="indefinite"
        path="M646 106 C 700 106, 700 106, 754 106 C 810 106, 810 106, 866 106 C 900 106, 900 106, 934 106"/>
      <animate attributeName="opacity" dur="3.4s" repeatCount="indefinite"
        values="0;1;1;1;0" keyTimes="0;0.08;0.5;0.9;1"/>
    </circle>
  </g>
</svg>
